<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>수학 연산 100문제 챌린지</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans KR", sans-serif;
      background: #f3f6fb;
      color: #222;
    }

    .app {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      min-height: 100vh;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      margin: 0 0 8px;
      font-size: 27px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      font-size: 15px;
      margin-bottom: 18px;
      line-height: 1.5;
    }

    .rule-box {
      background: #f8fafc;
      border-radius: 14px;
      padding: 12px;
      font-size: 14px;
      color: #444;
      line-height: 1.6;
      margin-bottom: 16px;
    }

    .operation-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 18px;
    }

    .operation-item {
      border: 2px solid #dce3ef;
      border-radius: 14px;
      padding: 13px;
      font-size: 17px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
    }

    .operation-item input {
      width: 20px;
      height: 20px;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 15px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      background: #2563eb;
      color: white;
    }

    button:active {
      transform: scale(0.98);
    }

    .secondary-button {
      background: #475569;
    }

    .danger-button {
      background: #dc2626;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .stat-box {
      background: #eef4ff;
      border-radius: 14px;
      padding: 10px 6px;
      text-align: center;
    }

    .stat-label {
      font-size: 12px;
      color: #555;
      margin-bottom: 4px;
    }

    .stat-value {
      font-size: 20px;
      font-weight: bold;
      color: #1e40af;
    }

    .question-area {
      text-align: center;
      padding: 28px 20px;
    }

    .question-number {
      color: #666;
      margin-bottom: 10px;
    }

    .question {
      font-size: 46px;
      font-weight: bold;
      margin: 20px 0;
      line-height: 1.3;
    }

    .answer-input {
      width: 100%;
      padding: 16px;
      font-size: 28px;
      text-align: center;
      border: 3px solid #cbd5e1;
      border-radius: 16px;
      outline: none;
      margin-bottom: 12px;
    }

    .answer-input:focus {
      border-color: #2563eb;
    }

    .feedback {
      min-height: 30px;
      font-size: 21px;
      font-weight: bold;
      margin-top: 10px;
    }

    .correct { color: #2563eb; }
    .wrong { color: #dc2626; }

    .history-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 240px;
      overflow-y: auto;
    }

    .history-item {
      padding: 10px 12px;
      border-radius: 12px;
      background: #f8fafc;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-size: 15px;
    }

    .rank-item {
      padding: 10px 12px;
      border-radius: 12px;
      background: #f8fafc;
      font-size: 15px;
      line-height: 1.5;
    }

    .rank-main {
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      gap: 10px;
    }

    .rank-sub {
      color: #666;
      font-size: 13px;
      margin-top: 4px;
    }

    .hidden { display: none; }

    .warning {
      color: #dc2626;
      text-align: center;
      margin-top: 10px;
      min-height: 20px;
    }

    @media (max-width: 430px) {
      .app {
        padding: 14px;
      }

      .operation-list {
        grid-template-columns: 1fr;
      }

      .question {
        font-size: 38px;
      }

      .answer-input {
        font-size: 24px;
      }

      .stats {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>

<body>
<div class="app">

  <section id="startScreen" class="card">
    <h1>수학 연산 100문제 챌린지</h1>

    <div class="subtitle">
      100문제를 모두 맞히면 성공입니다.<br>
      한 문제라도 틀리면 즉시 게임 오버입니다.
    </div>

    <div class="rule-box">
      · 제한 시간: 1시간<br>
      · 정답 점수: 10 × 현재 난이도<br>
      · 5문제 정답마다 난이도 1단계 상승<br>
      · 100문제 완주 보너스: 3600 - 걸린 시간(초)<br>
      · 10단계 이상부터 복합 문제가 자동 등장
    </div>

    <div class="operation-list">
      <label class="operation-item">
        <input type="checkbox" value="add" checked>
        덧셈
      </label>

      <label class="operation-item">
        <input type="checkbox" value="sub" checked>
        뺄셈
      </label>

      <label class="operation-item">
        <input type="checkbox" value="mul" checked>
        곱셈
      </label>

      <label class="operation-item">
        <input type="checkbox" value="div" checked>
        나눗셈
      </label>

      <label class="operation-item">
        <input type="checkbox" value="square">
        제곱
      </label>

      <label class="operation-item">
        <input type="checkbox" value="sqrt">
        제곱근
      </label>

      <label class="operation-item">
        <input type="checkbox" value="cube">
        세제곱
      </label>

      <label class="operation-item">
        <input type="checkbox" value="fourth">
        네제곱
      </label>
    </div>

    <button onclick="startGame()">게임 시작</button>
    <div id="startWarning" class="warning"></div>
  </section>

  <section class="card">
    <div class="history-title">명예의 전당 TOP 3</div>
    <div id="rankingList" class="history-list"></div>
    <button class="danger-button" style="margin-top:12px;" onclick="clearRanking()">랭킹 초기화</button>
  </section>

  <section id="gameScreen" class="hidden">

    <div class="card stats">
      <div class="stat-box">
        <div class="stat-label">점수</div>
        <div id="scoreText" class="stat-value">0</div>
      </div>

      <div class="stat-box">
        <div class="stat-label">정답</div>
        <div id="correctText" class="stat-value">0</div>
      </div>

      <div class="stat-box">
        <div class="stat-label">오답</div>
        <div id="wrongText" class="stat-value">0</div>
      </div>

      <div class="stat-box">
        <div class="stat-label">난이도</div>
        <div id="levelText" class="stat-value">1</div>
      </div>

      <div class="stat-box">
        <div class="stat-label">문제</div>
        <div id="questionCountText" class="stat-value">1 / 100</div>
      </div>

      <div class="stat-box">
        <div class="stat-label">시간</div>
        <div id="timerText" class="stat-value">0:00</div>
      </div>
    </div>

    <div class="card question-area">
      <div id="questionNumber" class="question-number">1번 문제</div>
      <div id="questionText" class="question">3 + 4</div>

      <input
        id="answerInput"
        class="answer-input"
        type="number"
        inputmode="numeric"
        placeholder="정답 입력"
        autocomplete="off"
      >

      <button onclick="submitAnswer()">제출</button>
      <div id="feedback" class="feedback"></div>
    </div>

    <button class="secondary-button" onclick="resetGame()">다시 시작</button>

    <div class="card">
      <div class="history-title">최근 풀이 기록</div>
      <div id="historyList" class="history-list"></div>
    </div>

  </section>
</div>

<script>
  const TOTAL_QUESTIONS = 100;
  const MAX_TIME_SECONDS = 3600;
  const MAX_LEVEL = 20;
  const STORAGE_KEY = "mathChallengeTop3";

  let selectedOperations = [];

  let score = 0;
  let correctCount = 0;
  let wrongCount = 0;
  let level = 1;
  let questionCount = 1;

  let currentQuestion = null;
  let history = [];
  let isWaitingNext = false;
  let isGameRunning = false;

  let startTime = null;
  let timerInterval = null;
  let elapsedSeconds = 0;

  const startScreen = document.getElementById("startScreen");
  const gameScreen = document.getElementById("gameScreen");

  const scoreText = document.getElementById("scoreText");
  const correctText = document.getElementById("correctText");
  const wrongText = document.getElementById("wrongText");
  const levelText = document.getElementById("levelText");
  const questionCountText = document.getElementById("questionCountText");
  const timerText = document.getElementById("timerText");

  const questionText = document.getElementById("questionText");
  const questionNumber = document.getElementById("questionNumber");
  const answerInput = document.getElementById("answerInput");
  const feedback = document.getElementById("feedback");
  const historyList = document.getElementById("historyList");
  const rankingList = document.getElementById("rankingList");

  answerInput.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
      submitAnswer();
    }
  });

  function startGame() {
    selectedOperations = Array.from(
      document.querySelectorAll(".operation-item input:checked")
    ).map(function(input) {
      return input.value;
    });

    if (selectedOperations.length === 0) {
      document.getElementById("startWarning").textContent =
        "연산을 최소 1개 이상 선택하세요.";
      return;
    }

    document.getElementById("startWarning").textContent = "";

    score = 0;
    correctCount = 0;
    wrongCount = 0;
    level = 1;
    questionCount = 1;
    history = [];
    elapsedSeconds = 0;
    isWaitingNext = false;
    isGameRunning = true;

    clearInterval(timerInterval);

    startScreen.classList.add("hidden");
    gameScreen.classList.remove("hidden");

    startTimer();
    makeQuestion();
    updateScreen();

    answerInput.focus();
  }

  function resetGame() {
    clearInterval(timerInterval);

    isGameRunning = false;
    isWaitingNext = false;

    gameScreen.classList.add("hidden");
    startScreen.classList.remove("hidden");

    answerInput.value = "";
    feedback.textContent = "";
    feedback.className = "feedback";

    renderRanking();
  }

  function startTimer() {
    startTime = Date.now();

    timerText.textContent = "0:00";

    timerInterval = setInterval(function() {
      if (!isGameRunning) return;

      elapsedSeconds = Math.floor((Date.now() - startTime) / 1000);
      timerText.textContent = formatTime(elapsedSeconds);

      if (elapsedSeconds >= MAX_TIME_SECONDS) {
        timeOverGameOver();
      }
    }, 1000);
  }

  function formatTime(seconds) {
    const min = Math.floor(seconds / 60);
    const sec = seconds % 60;

    return min + ":" + String(sec).padStart(2, "0");
  }

  function randomInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function randomSignedNumber(max) {
    const number = randomInt(1, max);

    if (Math.random() < 0.7) {
      return number;
    }

    return -number;
  }

  function getMaxNumber() {
    return 10 + level * 10;
  }

  function getSmallMaxNumber() {
    return Math.min(12 + level, 25);
  }

  function getCubeMaxNumber() {
    return Math.min(3 + Math.floor(level / 3), 6);
  }

  function getFourthMaxNumber() {
    return Math.min(2 + Math.floor(level / 4), 4);
  }

  function pickOperation() {
    const index = randomInt(0, selectedOperations.length - 1);
    return selectedOperations[index];
  }

  function formatNumber(num) {
    if (num < 0) {
      return "(" + num + ")";
    }

    return String(num);
  }

  function shouldMakeMixedQuestion() {
    if (level < 10) {
      return false;
    }

    return Math.random() < 0.35;
  }

  function makeQuestion() {
    if (shouldMakeMixedQuestion()) {
      makeMixedQuestion();
      return;
    }

    const operation = pickOperation();

    const max = getMaxNumber();
    const smallMax = getSmallMaxNumber();
    const cubeMax = getCubeMaxNumber();
    const fourthMax = getFourthMaxNumber();

    let a;
    let b;
    let answer;
    let text;

    if (operation === "add") {
      a = randomSignedNumber(max);
      b = randomSignedNumber(max);

      answer = a + b;
      text = formatNumber(a) + " + " + formatNumber(b);
    }

    if (operation === "sub") {
      a = randomSignedNumber(max);
      b = randomSignedNumber(max);

      answer = a - b;
      text = formatNumber(a) + " - " + formatNumber(b);
    }

    if (operation === "mul") {
      a = randomSignedNumber(smallMax);
      b = randomSignedNumber(smallMax);

      answer = a * b;
      text = formatNumber(a) + " × " + formatNumber(b);
    }

    if (operation === "div") {
      b = randomSignedNumber(smallMax);
      answer = randomSignedNumber(smallMax);

      a = b * answer;

      text = formatNumber(a) + " ÷ " + formatNumber(b);
    }

    if (operation === "square") {
      a = randomSignedNumber(smallMax);

      answer = a * a;
      text = formatNumber(a) + "²";
    }

    if (operation === "sqrt") {
      answer = randomInt(1, smallMax);
      a = answer * answer;

      text = "√" + a;
    }

    if (operation === "cube") {
      a = randomSignedNumber(cubeMax);

      answer = a * a * a;
      text = formatNumber(a) + "³";
    }

    if (operation === "fourth") {
      a = randomSignedNumber(fourthMax);

      answer = a * a * a * a;
      text = formatNumber(a) + "⁴";
    }

    currentQuestion = {
      text: text,
      answer: answer
    };

    questionText.textContent = currentQuestion.text;
    answerInput.value = "";

    feedback.textContent = "";
    feedback.className = "feedback";

    isWaitingNext = false;

    updateScreen();

    setTimeout(function() {
      answerInput.focus();
    }, 50);
  }

  function makeMixedQuestion() {
    const type = randomInt(1, 8);

    let a;
    let b;
    let c;
    let answer;
    let text;

    if (type === 1) {
      a = randomInt(1, 10);
      b = randomInt(1, 10);

      answer = a * a + b * b;
      text = a + "² + " + b + "²";
    }

    if (type === 2) {
      a = randomInt(1, 12);
      b = randomInt(1, 12);

      answer = a * a - b * b;
      text = a + "² - " + b + "²";
    }

    if (type === 3) {
      a = randomInt(1, 5);
      b = randomInt(1, 10);

      answer = a * a * a + b * b;
      text = a + "³ + " + b + "²";
    }

    if (type === 4) {
      a = randomInt(1, 4);
      b = randomInt(1, 10);

      answer = a * a * a * a - b * b;
      text = a + "⁴ - " + b + "²";
    }

    if (type === 5) {
      a = randomInt(1, 10);
      b = randomInt(1, 10);

      answer = a + b * b;
      text = "√" + (a * a) + " + " + b + "²";
    }

    if (type === 6) {
      a = randomInt(1, 5);
      b = randomInt(1, 10);

      answer = a * a * a - b;
      text = a + "³ - √" + (b * b);
    }

    if (type === 7) {
      a = randomInt(1, 5);
      b = randomInt(1, 5);
      c = randomInt(1, 6);

      answer = a * a + b * b * b - c;
      text = a + "² + " + b + "³ - " + c;
    }

    if (type === 8) {
      a = randomInt(1, 4);
      b = randomInt(1, 8);
      c = randomInt(1, 6);

      answer = a * a * a * a + b * b - c * c;
      text = a + "⁴ + " + b + "² - " + c + "²";
    }

    currentQuestion = {
      text: text,
      answer: answer
    };

    questionText.textContent = currentQuestion.text;
    answerInput.value = "";

    feedback.textContent = "";
    feedback.className = "feedback";

    isWaitingNext = false;

    updateScreen();

    setTimeout(function() {
      answerInput.focus();
    }, 50);
  }

  function submitAnswer() {
    if (!isGameRunning || isWaitingNext) {
      return;
    }

    const userAnswerText = answerInput.value.trim();

    if (userAnswerText === "") {
      feedback.textContent = "정답을 입력하세요.";
      feedback.className = "feedback wrong";
      return;
    }

    const userAnswer = Number(userAnswerText);
    const isCorrect = userAnswer === currentQuestion.answer;

    if (isCorrect) {
      processCorrectAnswer(userAnswerText);
    } else {
      processWrongAnswer(userAnswerText);
    }
  }

  function processCorrectAnswer(userAnswerText) {
    const earnedPoint = 10 * level;

    score += earnedPoint;
    correctCount++;

    feedback.textContent = "정답! +" + earnedPoint + "점";
    feedback.className = "feedback correct";

    addHistory(
      currentQuestion.text,
      userAnswerText,
      currentQuestion.answer,
      true
    );

    if (correctCount % 5 === 0) {
      level = Math.min(level + 1, MAX_LEVEL);
    }

    updateScreen();

    if (correctCount >= TOTAL_QUESTIONS) {
      isWaitingNext = true;

      setTimeout(function() {
        finishGame();
      }, 700);

      return;
    }

    questionCount++;

    isWaitingNext = true;

    setTimeout(function() {
      makeQuestion();
    }, 700);
  }

  function processWrongAnswer(userAnswerText) {
    wrongCount++;

    feedback.textContent = "오답! 정답은 " + currentQuestion.answer;
    feedback.className = "feedback wrong";

    addHistory(
      currentQuestion.text,
      userAnswerText,
      currentQuestion.answer,
      false
    );

    updateScreen();

    isWaitingNext = true;

    setTimeout(function() {
      gameOver("오답");
    }, 900);
  }

  function finishGame() {
    if (!isGameRunning) {
      return;
    }

    clearInterval(timerInterval);
    isGameRunning = false;

    elapsedSeconds = Math.floor((Date.now() - startTime) / 1000);

    const timeBonus = Math.max(0, MAX_TIME_SECONDS - elapsedSeconds);
    score += timeBonus;

    updateScreen();

    const playerName = prompt(
      "100문제 완주 성공!\n\n" +
      "걸린 시간: " + formatTime(elapsedSeconds) + "\n" +
      "시간 보너스: " + timeBonus + "점\n" +
      "최종 점수: " + score + "점\n\n" +
      "이름을 입력하세요."
    );

    if (playerName && playerName.trim() !== "") {
      saveRanking(
        playerName.trim(),
        score,
        correctCount,
        level,
        elapsedSeconds,
        true
      );
    }

    renderRanking();

    gameScreen.classList.add("hidden");
    startScreen.classList.remove("hidden");
  }

  function gameOver(reason) {
    if (!isGameRunning) {
      return;
    }

    clearInterval(timerInterval);
    isGameRunning = false;

    elapsedSeconds = Math.floor((Date.now() - startTime) / 1000);

    const playerName = prompt(
      "게임 오버! (" + reason + ")\n\n" +
      "정답 수: " + correctCount + "개\n" +
      "걸린 시간: " + formatTime(elapsedSeconds) + "\n" +
      "최종 점수: " + score + "점\n\n" +
      "이름을 입력하세요."
    );

    if (playerName && playerName.trim() !== "") {
      saveRanking(
        playerName.trim(),
        score,
        correctCount,
        level,
        elapsedSeconds,
        false
      );
    }

    renderRanking();

    gameScreen.classList.add("hidden");
    startScreen.classList.remove("hidden");
  }

  function timeOverGameOver() {
    gameOver("시간 초과");
  }

  function addHistory(question, userAnswer, correctAnswer, isCorrect) {
    history.unshift({
      question: question,
      userAnswer: userAnswer,
      correctAnswer: correctAnswer,
      isCorrect: isCorrect
    });

    if (history.length > 10) {
      history.pop();
    }

    renderHistory();
  }

  function renderHistory() {
    historyList.innerHTML = "";

    if (history.length === 0) {
      historyList.innerHTML =
        "<div style='color:#666;'>아직 기록이 없습니다.</div>";
      return;
    }

    history.forEach(function(item) {
      const div = document.createElement("div");
      div.className = "history-item";

      const left = document.createElement("span");
      left.textContent = item.question + " = " + item.userAnswer;

      const right = document.createElement("span");

      if (item.isCorrect) {
        right.textContent = "정답";
        right.className = "correct";
      } else {
        right.textContent = "오답 / 정답 " + item.correctAnswer;
        right.className = "wrong";
      }

      div.appendChild(left);
      div.appendChild(right);

      historyList.appendChild(div);
    });
  }

  function updateScreen() {
    scoreText.textContent = score;
    correctText.textContent = correctCount;
    wrongText.textContent = wrongCount;
    levelText.textContent = level;
    questionCountText.textContent = questionCount + " / " + TOTAL_QUESTIONS;
    questionNumber.textContent = questionCount + "번 문제";

    renderHistory();
  }

  function getRanking() {
    const saved = localStorage.getItem(STORAGE_KEY);

    if (!saved) {
      return [];
    }

    try {
      return JSON.parse(saved);
    } catch (error) {
      return [];
    }
  }

  function saveRanking(name, score, correctCount, level, elapsedSeconds, completed) {
    const ranking = getRanking();

    ranking.push({
      name: name,
      score: score,
      correctCount: correctCount,
      level: level,
      elapsedSeconds: elapsedSeconds,
      completed: completed,
      date: new Date().toLocaleString()
    });

    ranking.sort(function(a, b) {
      if (b.score !== a.score) {
        return b.score - a.score;
      }

      if (b.correctCount !== a.correctCount) {
        return b.correctCount - a.correctCount;
      }

      return a.elapsedSeconds - b.elapsedSeconds;
    });

    const topThree = ranking.slice(0, 3);

    localStorage.setItem(STORAGE_KEY, JSON.stringify(topThree));
  }

  function renderRanking() {
    const ranking = getRanking();

    rankingList.innerHTML = "";

    if (ranking.length === 0) {
      rankingList.innerHTML =
        "<div style='color:#666;'>아직 기록이 없습니다.</div>";
      return;
    }

    ranking.forEach(function(item, index) {
      const div = document.createElement("div");
      div.className = "rank-item";

      const main = document.createElement("div");
      main.className = "rank-main";

      const left = document.createElement("span");
      left.textContent = (index + 1) + "등 " + item.name;

      const right = document.createElement("span");
      right.textContent = item.score + "점";

      main.appendChild(left);
      main.appendChild(right);

      const sub = document.createElement("div");
      sub.className = "rank-sub";

      const completeText = item.completed ? "완주 성공" : "중도 탈락";

      sub.textContent =
        completeText +
        " / 정답 " + item.correctCount + "개" +
        " / 시간 " + formatTime(item.elapsedSeconds) +
        " / " + item.date;

      div.appendChild(main);
      div.appendChild(sub);

      rankingList.appendChild(div);
    });
  }

  function clearRanking() {
    const ok = confirm("랭킹 기록을 모두 삭제할까요?");

    if (!ok) {
      return;
    }

    localStorage.removeItem(STORAGE_KEY);
    renderRanking();
  }

  renderRanking();
  renderHistory();
</script>

</body>
</html>
